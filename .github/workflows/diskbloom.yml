name: DiskBloom
on:
  push:
    branches: [main]
    paths: ['diskbloom/**', '.github/workflows/diskbloom.yml', 'LICENSE']
  pull_request:
    paths: ['diskbloom/**', '.github/workflows/diskbloom.yml', 'LICENSE']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: diskbloom
    steps:
      - uses: actions/checkout@v4
      - name: Build app with pinned cloud helper
        run: ./Scripts/build_app.sh --cloud
      - name: Test scanner, safety, worker, and real-rclone fixtures
        timeout-minutes: 5
        run: ./Scripts/test.sh
      - name: Package and verify release archives
        run: ./Scripts/make_release.sh --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: DiskBloom-preview
          path: |
            diskbloom/dist/*.dmg
            diskbloom/dist/*.zip
            diskbloom/dist/*.sha256
          if-no-files-found: error
