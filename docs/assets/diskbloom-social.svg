<text x="68" y="265.0" fill="#EEF3FD" font-size="72" font-weight="700" letter-spacing="-3">DiskBloom</text>
<text x="72" y="328.0" fill="#EEF3FD" font-size="32" font-weight="500" letter-spacing="-.5">See your space. Find your room.</text>
<text x="72" y="377.0" fill="#A6B5D0" font-size="21">Explore your disks. Review your files.</text>
<text x="72" y="408.0" fill="#A6B5D0" font-size="21">Make space for what matters.</text>
