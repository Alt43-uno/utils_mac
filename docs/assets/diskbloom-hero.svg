<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title description">
<title id="title">DiskBloom — See your space. Find your room.</title>
<desc id="description">Original DiskBloom artwork: a pastel radial disk map on a deep navy background. Native disk analysis for macOS.</desc>
<defs>
<linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#182238"/><stop offset="1" stop-color="#26364F"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#6BDDBA" stop-opacity=".12"/><stop offset="1" stop-color="#6BDDBA" stop-opacity="0"/></radialGradient>
</defs>
