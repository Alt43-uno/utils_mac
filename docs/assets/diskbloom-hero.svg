<text x="68" y="205.0" fill="#EEF3FD" font-size="72" font-weight="700" letter-spacing="-3">DiskBloom</text>
<text x="72" y="268.0" fill="#EEF3FD" font-size="32" font-weight="500" letter-spacing="-.5">See your space. Find your room.</text>
<text x="72" y="317.0" fill="#A6B5D0" font-size="21">Explore your disks. Review your files.</text>
<text x="72" y="348.0" fill="#A6B5D0" font-size="21">Make space for what matters.</text>
